name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Build and test CPL parser
        working-directory: src/chronocone_planning_language
        run: ./gradlew build test

      - name: Cache Embedded Postgres
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: ${{ runner.os }}-embedded-postgres-${{ hashFiles('src/backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-embedded-postgres-

      - name: Build Go backend
        working-directory: src/backend
        run: make generate

      - name: Test Go backend
        working-directory: src/backend
        run: make test

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run linter
        working-directory: src/frontend
        run: npm run lint

      - name: Check code formatting
        working-directory: src/frontend
        run: npm run format:check

      - name: Run TypeScript type check
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: src/frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
