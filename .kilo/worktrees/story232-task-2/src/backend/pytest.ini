[pytest]
# Test discovery configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration for pytest-asyncio
asyncio_mode = auto

# Display detailed tracebacks and full diffs, enable verbosity
addopts = -v -ra --tb=short --strict-markers

# Define custom markers
markers =
    unit: Unit tests for isolated functionality
    integration: Integration tests requiring external services
    slow: Tests that take a long time to run
    api: Tests for API endpoints

[coverage:run]
# Measure coverage for the src directory
source = src

[coverage:report]
# Show missing lines in the report
show_missing = true
# Minimum coverage percentage (0 means no enforcement)
fail_under = 0
